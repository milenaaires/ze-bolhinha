site_name: Zé Bolhinha
site_description: Documentação do projeto Zé Bolhinha

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Mudar para tema escuro
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Mudar para tema claro
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Projeto: projeto/visao-geral.md
  - Discovery: pesquisa/discovery.md
  - Andamento: pesquisa/andamento.md

