site_name: Zé Bolhinha
site_description: Documentação do projeto Zé Bolhinha

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Mudar para tema escuro
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Mudar para tema claro
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Projeto:
      - Visão geral: projeto/visao-geral.md
      - Organização do trabalho: projeto/organizacao.md
      - Passagem de liderança: projeto/passagem-de-lideranca.md
  - Discovery: pesquisa/discovery.md
  - Deep dive: pesquisa/deep-dive.md
  - Pesquisa com eleitores:
      - Formulário (rodada 1): pesquisa/eleitores/formulario.md
      - Roteiro e registro de entrevistas: pesquisa/eleitores/roteiro-entrevista.md
  - Andamento: pesquisa/andamento.md

